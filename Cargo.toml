[workspace]
resolver = "3"
members = [
    "nabla",
    "nabla-macros",
]

[workspace.package]
version = "0.1.0"
authors = ["Techcable"]
edition = "2024"
# Rust 1.71 - syn@3.0.0
# Rust 1.85 - 2024 edition
# Rust 1.88 - let chains, darling@0.24.0
# Rust 1.95 - if let guards on match arms
#
# if changed, keep in sync with CI
rust-version = "1.95"
repository = "https://github.com/Techcable/nabla.rs"
license = "MIT OR Apache-2.0"
keywords = [
    "derive",
    "macro",
    "proc-macro",
]
categories = [
    "no-std",
    "no-std::no-alloc",
    "rust-patterns",
]

[workspace.dependencies]
## data structures

indexmap = "2"

## macro deps

darling = "0.24"
# helps with debugging (optional)
macro-expander = "0.1"
proc-macro2 = "1"
quote = "1"
syn = "3"

## workspace deps

nabla-macros = { path = "nabla-macros", version = "=0.1.0" }

## Define lints which should be shared across all crates in `[workspace.lints]`.
## Cargo places limits on inheritance overrides of lints,
## so crate-specific changes should be at the top of lib.rs
##
## In general, lints should be `warn` so that it doesn't fail the build for downstream users.
## Warnings are fatal in CI, so this shouldn't harm code quality.

[workspace.lints.clippy]
## groups

cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

## avoid accidentally depending on stdlib

alloc_instead_of_core = "warn"
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"

## aggressively lint casts ##
# in an ideal world. overflowing casts would panic
# linting them (with deny) is the second best option

cast_lossless = "allow" # lossless casts are fine, lints will catch if types change
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_ptr_alignment = "deny"
cast_sign_loss = "deny"
char_lit_as_u8 = "deny"
fn_to_numeric_cast = "deny"
fn_to_numeric_cast_any = "deny"
fn_to_numeric_cast_with_truncation = "deny"
ptr_as_ptr = "allow" # pointer casts are fine as long as they don't violate another rule

# safety

missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny" # all unsafe blocks should be documented

# clippy::restrictions group

mod_module_files = "warn"
redundant_test_prefix = "warn"

# excessively pedantic

needless_continue = "allow"
redundant_else = "allow"

[workspace.metadata.cargo-reedme]
note = "Do not edit - automatically generated by cargo-reedme"
